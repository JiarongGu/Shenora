<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shenora mobile sample</title>
<!--
  MAUI's own bridge library. WITHOUT THIS `window.HybridWebView` simply does not exist, and the
  failure is quiet in the worst way: the page renders, the log prints "-> SHENORA/READY" (because
  that line runs BEFORE the send), the TypeError goes nowhere visible, and the host sits there
  reporting "waiting for the page handshake". Found exactly that way on the first run.
  .NET 10 serves it from _framework/; on .NET 9 you shipped a copy under scripts/ yourself.
-->
<script src="_framework/hybridwebview.js"></script>
<style>
  :root { color-scheme: dark; }
  /*
    The safe-area insets are NOT optional once a page ships to more than one mobile shell, and this
    is what proves it: the identical markup looked correct on an Android emulator for a whole session
    and put its heading underneath the status bar and the Dynamic Island the first time it ran on an
    iPhone simulator. `viewport-fit=cover` (in the meta above) is what makes env() report real values
    rather than 0, so the two go together — and on a shell with no insets every calc() below collapses
    back to the plain 12px.
  */
  body { margin: 0;
         padding: calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
                  calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
         background: #14161a; color: #e6e6e6;
         font: 13px/1.45 ui-monospace, "Cascadia Mono", Menlo, monospace; }
  h1 { font-size: 15px; margin: 0 0 2px; color: #7fd1ff; }
  .sub { color: #8b93a1; margin-bottom: 10px; font-size: 11px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  button { flex: 1 1 auto; min-width: 90px; padding: 10px 8px; border-radius: 8px;
           border: 1px solid #333a45; background: #1e232b; color: #e6e6e6; font: inherit; }
  button:active { background: #2b323d; }
  #log { border: 1px solid #262c35; border-radius: 8px; padding: 8px; height: 30vh;
         overflow: auto; background: #0f1114; white-space: pre-wrap; word-break: break-word; }
  .t { color: #5c6672; }
  .out { color: #ffd479; }
  .in  { color: #9cdc8f; }
  .evt { color: #cba6f7; }
  .err { color: #ff6b6b; }
</style>
</head>
<body>
<h1>Shenora · mobile shell</h1>
<div class="sub">the same IPC envelope the desktop shell speaks, over HybridWebView</div>
<div class="row">
  <button id="echo">ECHO</button>
  <button id="copy">COPY_TEXT</button>
  <button id="read">READ_CLIPBOARD</button>
  <button id="ui">UI_STATE</button>
</div>
<div class="row">
  <button id="sched">SCHEDULE_DEMO</button>
  <button id="pick">PICK_FILE</button>
  <button id="save">SAVE_TEXT</button>
  <button id="bad">unknown route</button>
</div>
<!--
  DM1 — the media probe. `app://media/?src=<clip>` is answered by MediaRangeProbe on the host side.
  The two clips are the SAME content and differ only in where the mp4 index sits:
    faststart  — index at the front: plays even from a server that ignores Range. The control.
    moov-at-end — index at the end: cannot start at all unless the host answers a range request for
                  the tail. The test. "It played" only means something when these two differ.
  The picture carries a big seconds counter, so a screenshot after SEEK proves the position.
-->
<div class="row">
  <button id="mfast">▶ faststart</button>
  <button id="mtail">▶ moov-at-end</button>
  <button id="mseek">SEEK 48s</button>
  <button id="mwhere">where?</button>
</div>
<!--
  Two independent axes, because the first device run refused a response that was provably CORRECT
  (the host read the native object back: mime=video/mp4, status=206, Content-Range present) and the
  cause could be in either axis.

  mode — how the host hands the answer over: `portable` is MAUI's SetResponse with a header
    dictionary, `whole` is the same but always 200 with the entire file (separates "206 refused" from
    "the content type never arrived"), `native` writes the platform response object by hand.
  url  — what the page ASKS FOR: our handler under the app scheme, our handler under an https virtual
    host, or `bundle` — MAUI's own static serving of the same file on the page's own origin, which
    touches none of our code and is therefore the control for the file, the codec and the device's
    media stack. If `bundle` fails too, nothing above it is the bug.
-->
<div class="row">
  <button id="mmode">mode: noskip</button>
  <button id="murl">url: origin</button>
  <button id="mrange">RANGE test</button>
</div>
<video id="vid" controls playsinline preload="none"
       style="width:100%; max-height:34vh; background:#000; border-radius:8px; margin-bottom:10px;"></video>
<div id="log"></div>

<script type="module">
// This page speaks the envelope by hand — a real app uses `@shenora/react`'s bridge, which does
// correlation, timeouts and category routing. What it does NOT hand-write is the TRANSPORT: it
// imports the shipped `createHostTransport()` from the published package, so the code carrying
// bytes on this device is the code an adopter gets, not a copy of it.
//
// dist/transport.js is dependency-free ESM, which is why a plain file drop works here with no
// bundler. If it is absent (a fresh clone that has not built the npm package), the inline fallback
// below keeps the sample runnable — and the log says which one is in use, because "it works" means
// different things for the two.
const logEl = document.getElementById('log');
let seq = 0;
const pending = new Map();

function log(cls, text) {
  const time = new Date().toISOString().substr(11, 8);
  logEl.insertAdjacentHTML('beforeend', `<div><span class="t">${time}</span> <span class="${cls}">${text}</span></div>`);
  logEl.scrollTop = logEl.scrollHeight;
  mirrorToHost(text);
}

// ── page state as TEXT, not pixels ───────────────────────────────────────────────────────────────
// Sends every page log line to the host, which writes it to the DEVICE log — so `dev.mjs mac log` and
// `android log` can be grepped for it. A screenshot cannot report a number, a header or an array, and
// reading those off pixels is what made the DM1 media work slow.
//
// ⚠ `console.log` was tried FIRST and does not work: WebKit does not forward a page's console to the
// unified log (measured on the simulator — a tagged line, zero hits). Hence the IPC route.
//
// ⚠⚠ TWO recursion traps, and both bite instantly if you route this through post()/log():
//   1. post() CALLS log(), so a mirror inside log() would log→post→log forever. This sends on the raw
//      channel itself and never calls log().
//   2. The host ANSWERS every request, and the response handler calls log() — so the reply to a mirrored
//      line would mirror again, and the host would answer that. The `d`-prefixed id below is what the
//      response handler uses to drop these silently.
let diagSeq = 0;
function mirrorToHost(text) {
  try {
    channel.post(JSON.stringify({
      id: `d${++diagSeq}`, module: 'PAGE_DIAG', type: 'LOG',
      payload: { text }, timestamp: new Date().toISOString(),
    }));
  } catch { /* the channel may not exist yet during boot — a lost diagnostic must never break the page */ }
}

/** The last-resort channel, used only when the shipped package has not been built. */
const inlineTransport = {
  post: (message) => window.HybridWebView.SendRawMessage(message),
  subscribe: (listener) => {
    const handler = (e) => { if (typeof e.detail?.message === 'string') listener(e.detail.message); };
    window.addEventListener('HybridWebViewMessageReceived', handler);
    return () => window.removeEventListener('HybridWebViewMessageReceived', handler);
  },
};

let channel = inlineTransport;
let channelSource = 'INLINE fallback (dist/transport.js was not bundled)';
try {
  const shipped = await import('./shenora/transport.js');
  const detected = shipped.createHostTransport();
  if (detected) {
    channel = detected;
    channelSource = `SHIPPED @shenora/react transport (isShenoraAvailable=${shipped.isShenoraAvailable()})`;
  }
} catch {
  // Absent or unparseable — the fallback above stands, and the log below says so.
}

function post(module, type, payload) {
  const id = `c${++seq}`;
  // ISO string, NOT Date.now(). The envelope's `timestamp` is a DateTimeOffset host-side and the
  // kit's own client sends `new Date().toISOString()` (bridge.ts). Epoch milliseconds got the whole
  // request dropped at the boundary with "The JSON value could not be converted to
  // System.DateTimeOffset" — correctly logged host-side and, correctly, invisible to the page.
  const request = { id, module, type, payload, timestamp: new Date().toISOString() };
  log('out', `-> ${module}/${type} ${payload ? JSON.stringify(payload) : ''}`);
  channel.post(JSON.stringify(request));
  return id;
}

channel.subscribe((raw) => {
  let msg;
  try { msg = JSON.parse(raw); }
  catch { log('err', `<- unparseable: ${raw}`); return; }

  // The host answers a request with a response envelope and pushes events as a NOTIFICATION BATCH
  // (always a batch, even of one — the kit's rule). `category` is what discriminates them.
  if (msg.category === 'notification') {
    for (const n of (msg.payload ?? [])) {
      log('evt', `<= EVENT ${n.module}/${n.type} ${n.payload ? JSON.stringify(n.payload) : ''}`);
    }
    return;
  }
  // Drop the host's replies to our own mirrored log lines, SILENTLY. Logging them would call log(),
  // which mirrors, which the host would answer — an endless round trip. See mirrorToHost.
  if (typeof msg.id === 'string' && msg.id.startsWith('d')) return;

  if (msg.success === false) {
    log('err', `<- FAIL ${msg.id} ${msg.error?.code}${msg.error?.parameters ? ' ' + JSON.stringify(msg.error.parameters) : ''}`);
  } else {
    log('in', `<- OK ${msg.id} ${msg.data !== undefined && msg.data !== null ? JSON.stringify(msg.data) : '(no data)'}`);
  }
});

// Every route below is a REAL one on PortableSampleFacade — the same net10.0 assembly the desktop
// sample hosts. The first version of this page invented a PATHS button and got a textbook
// NO_HANDLER back, which was the error boundary working correctly and the page being wrong.
// Shell-neutral strings: this page now runs on Android AND iOS, and "hello from android" showing up
// in an iPhone screenshot is a small lie of exactly the kind a shared bundle invites.
document.getElementById('echo').onclick  = () => post('SAMPLE_LOGIC', 'ECHO', { text: 'hello from the mobile shell' });
document.getElementById('copy').onclick  = () => post('SAMPLE_LOGIC', 'COPY_TEXT', { text: 'copied on the mobile shell' });
document.getElementById('read').onclick  = () => post('SAMPLE_LOGIC', 'READ_CLIPBOARD');
document.getElementById('ui').onclick    = () => post('SAMPLE_LOGIC', 'UI_STATE');
document.getElementById('sched').onclick = () => post('SAMPLE_LOGIC', 'SCHEDULE_DEMO');
document.getElementById('pick').onclick  = () => post('SAMPLE_LOGIC', 'PICK_FILE');
// SAVE_TEXT is the same route the desktop calls. Success with a NULL filePath is the correct mobile
// answer — the destination is a system grant, not an address — so the page must not read the missing
// path as failure.
document.getElementById('save').onclick  = () => post('SAMPLE_LOGIC', 'SAVE_TEXT', { text: 'saved from the mobile shell' });
document.getElementById('bad').onclick   = () => post('SAMPLE_LOGIC', 'NO_SUCH_ROUTE');

// ── DM1: media over the resource seam ────────────────────────────────────────────────────────────
// The URL is written with the trailing slash the platform inserts anyway (`app://media?x` arrives as
// `app://media/?x`). The host matches a parsed Uri, so either form works; this one just says out loud
// what actually goes over the wire.
const vid = document.getElementById('vid');
const MODES = ['noskip', 'portable', 'whole', 'native'];
const URLS = ['origin', 'app', 'https', 'bundle'];
let mode = MODES[0];
let urlForm = URLS[0];
const modeBtn = document.getElementById('mmode');
const urlBtn = document.getElementById('murl');
modeBtn.onclick = () => {
  mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
  modeBtn.textContent = `mode: ${mode}`;
  log('t', `response mode -> ${mode}`);
};
urlBtn.onclick = () => {
  urlForm = URLS[(URLS.indexOf(urlForm) + 1) % URLS.length];
  urlBtn.textContent = `url: ${urlForm}`;
  log('t', `url form -> ${urlForm}`);
};

function clipUrl(name) {
  // Cache-bust every load, or the webview answers a reload from its own copy and the host never sees
  // the request — which reads exactly like "the handler stopped being called".
  const bust = `n=${Date.now()}`;
  if (urlForm === 'bundle') return `media/${name}?${bust}`;   // MAUI's own static serving, no host code
  // RELATIVE on purpose: the page must not name the origin's scheme, because it differs per shell
  // (`https://0.0.0.1/` on Android, `app://0.0.0.1/` on iOS). This is the only form that is both
  // intercepted AND media-capable on both.
  if (urlForm === 'origin') return `/shenora-media/?src=${name}&mode=${mode}&${bust}`;
  const base = urlForm === 'https' ? 'https://shenora.media/' : 'app://media/';
  return `${base}?src=${name}&mode=${mode}&${bust}`;
}

function loadClip(name) {
  const url = clipUrl(name);
  log('t', `video.src = ${url}`);
  vid.src = url;
  vid.load();
  // A button click IS a user gesture, so autoplay policy does not block this. A rejection here is a
  // real failure and must be visible — a silent catch is how "it just does not play" becomes a
  // half-hour of guessing.
  vid.play().then(() => log('in', 'play() resolved')).catch(err => log('err', `play() REJECTED: ${err}`));
}

vid.addEventListener('loadedmetadata', () =>
  log('in', `loadedmetadata — duration=${vid.duration.toFixed(2)}s ${vid.videoWidth}x${vid.videoHeight}`));
vid.addEventListener('seeked', () => log('in', `seeked -> currentTime=${vid.currentTime.toFixed(2)}s`));
vid.addEventListener('error', () => {
  const e = vid.error;
  log('err', `video ERROR code=${e ? e.code : '?'} ${e && e.message ? e.message : ''}`);
});
// `duration` being Infinity/NaN is the tell for "the player never learned the length" — the exact
// failure mode iOS's two-byte `bytes=0-1` probe walks into when Content-Range does not come back.
document.getElementById('mfast').onclick  = () => loadClip('clip-faststart.mp4');
document.getElementById('mtail').onclick  = () => loadClip('clip-tailmoov.mp4');
document.getElementById('mseek').onclick  = () => {
  log('out', `seeking to 48s (from ${vid.currentTime.toFixed(2)}s, duration=${vid.duration})`);
  vid.currentTime = 48;
};
// The INSTRUMENT, added after the media pipeline gave two different failures on the same file and
// inference could not separate them. `fetch` with an explicit Range takes the demuxer out of the
// picture entirely and asks the one question that matters: does a SUB-RANGE — a 206 starting at a
// non-zero offset — arrive intact, with its Content-Range, at the requested offset?
//
// `bytes=4-11` is the check that a byte OFFSET is honoured rather than merely a length: those eight
// bytes of any mp4 are the ASCII "ftypisom". A length-only assertion passes just as happily on the
// wrong slice, which is how a seam that silently serves from 0 looks correct.
document.getElementById('mrange').onclick = async () => {
  const url = clipUrl('clip-faststart.mp4');
  for (const spec of ['bytes=4-11', 'bytes=1000-1099', 'bytes=474000-']) {
    try {
      const r = await fetch(url, { headers: { Range: spec } });
      const buf = new Uint8Array(await r.arrayBuffer());
      const ascii = Array.from(buf.slice(0, 8)).map(b => (b >= 32 && b < 127) ? String.fromCharCode(b) : '.').join('');
      const cls = r.status === 206 ? 'in' : 'err';
      log(cls, `RANGE ${spec} -> status=${r.status} CR=${r.headers.get('Content-Range')} ` +
               `got=${buf.byteLength}B first8="${ascii}"`);
    } catch (err) {
      log('err', `RANGE ${spec} -> threw ${err}`);
    }
  }
};

document.getElementById('mwhere').onclick = () => {
  const b = vid.buffered;
  const ranges = [];
  for (let i = 0; i < b.length; i++) ranges.push(`${b.start(i).toFixed(1)}-${b.end(i).toFixed(1)}`);
  log('t', `currentTime=${vid.currentTime.toFixed(2)}s duration=${vid.duration} ` +
           `paused=${vid.paused} readyState=${vid.readyState} buffered=[${ranges.join(' ')}]`);
};

// The handshake. Until this lands the host BUFFERS notifications rather than dropping them, which
// is why the tick events that fired before this point still arrive.
log('t', `channel: ${channelSource}`);
log('t', 'page loaded — sending handshake');
post('SHENORA', 'READY', { client: 'maui-sample' });

// The handshake's reply carries what the shell can do, so a real page renders its title bar and
// drop zones from DATA rather than from a platform check. This log line stands in for that; the
// desktop sample does the real version in App.tsx, and the two answers to the SAME handshake are
// `maui · [filePicker]` here against `winforms · [windowChrome, dropZones, filePicker,
// folderPicker, savePicker, secondaryWindows, tray]` there.
window.addEventListener('HybridWebViewMessageReceived', function shellProbe(e) {
  try {
    const msg = JSON.parse(e.detail.message);
    if (msg.category === 'ipc' && msg.id === 'c1' && msg.data) {
      log('t', `shell: ${msg.data.name} · capabilities: [${(msg.data.capabilities ?? []).join(', ')}]`);
      window.removeEventListener('HybridWebViewMessageReceived', shellProbe);
    }
  } catch { /* not ours */ }
});
</script>
</body>
</html>
