<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shenora mobile sample</title>
<!--
  MAUI's own bridge library. WITHOUT THIS `window.HybridWebView` simply does not exist, and the
  failure is quiet in the worst way: the page renders, the log prints "-> SHENORA/READY" (because
  that line runs BEFORE the send), the TypeError goes nowhere visible, and the host sits there
  reporting "waiting for the page handshake". Found exactly that way on the first run.
  .NET 10 serves it from _framework/; on .NET 9 you shipped a copy under scripts/ yourself.
-->
<script src="_framework/hybridwebview.js"></script>
<style>
  :root {
    color-scheme: dark;
    /*
      PRE-CONFIGURED DEFAULTS, and they exist because the platform will not tell us in time. Android
      reports env(safe-area-inset-*) as 0 for the whole first page load (measured), so a page that
      starts from the real value starts from zero and renders its first screen under the status bar.
      Starting from a sensible guess and CORRECTING is the better trade: the common case is right
      immediately, and the uncommon case moves once.

      24px is the ordinary Android status-bar / iOS home-indicator height in CSS px. It is deliberately
      a VARIABLE rather than a literal so an app that knows its device class can set it once, before
      first paint, and never see the correction at all.

      ⚠ THESE ARE NOW A FALLBACK, NOT THE MECHANISM. The SHELL publishes `--sa-*` at document start
      (`MobileSafeArea` + `SafeAreaOptions` in MainPage.cs), which is the only thing that can work:
      Android reports the display cutout to CSS but never the system bars, and reports nothing at all
      for the whole first page load. The values below are what this page falls back to when it is
      opened by something that does NOT publish them — a browser, or a shell that declined the option.
    */
    --sa-top: 24px;
    --sa-right: 0px;
    --sa-bottom: 24px;
    --sa-left: 0px;
    --sa-settle: 180ms;
    --sa-color: transparent;
  }
  /*
    The inset strips, painted with whatever the shell published. Fixed, so they never scroll away.

    ⚠ FOUR edges, not two. The first version painted only top and bottom, which is the portrait shape
    mistaken for the general one: rotate the device and the cutout moves to a SIDE, so the page padded
    itself correctly and left an unpainted band exactly where the notch is. Four BORDERS on one
    full-viewport element draw all four edges at independent thicknesses, which is why this needs
    neither a second pseudo-element nor any JS.
  */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    border-top: var(--sa-top) solid var(--sa-color);
    border-right: var(--sa-right) solid var(--sa-color);
    border-bottom: var(--sa-bottom) solid var(--sa-color);
    border-left: var(--sa-left) solid var(--sa-color);
  }
  /*
    The safe-area insets are NOT optional once a page ships to more than one mobile shell, and this
    is what proves it: the identical markup looked correct on an Android emulator for a whole session
    and put its heading underneath the status bar and the Dynamic Island the first time it ran on an
    iPhone simulator. `viewport-fit=cover` (in the meta above) is what makes env() report real values
    rather than 0, so the two go together — and on a shell with no insets every calc() below collapses
    back to the plain 12px.
  */
  /*
    ⚠ AND PADDING ALONE IS NOT ENOUGH — that is the second half of this lesson, found on a device
    (2026-08-05, Android 16 / API 36, where edge-to-edge is enforced) after the first half had been
    "fixed" for days. Inset padding on <body> positions the page correctly ONLY while it is scrolled to
    the top. The document itself scrolls, so the padded strip scrolls away with everything else and the
    content underneath it passes straight under the status bar / Dynamic Island. A screenshot after
    three swipes showed the button row rendering behind the clock and the battery icon.

    The fix is structural, not more padding: BODY MUST NOT SCROLL. It is a viewport-sized flex column
    that owns the insets permanently, and a child scrolls inside it. The inset region is then outside
    the scrolling box and nothing can ever enter it.

    Why not the popular alternative — a fixed overlay painted over the inset strip: that only HIDES
    content that is still there, which is right for a translucent status bar and wrong for a physical
    cutout, and it leaves the content unreachable underneath rather than never placed there.
  */
  html { height: 100%; }
  body { margin: 0; height: 100%; box-sizing: border-box;
         display: flex; flex-direction: column;
         overflow: hidden;               /* the document does not scroll — #scroll does */
         /*
           max(), NOT calc(12px + inset) — which is what this used to say, and it reserved 61 CSS px at
           the top where the platform asked for 49. The inset ALREADY includes the clearance; adding the
           page's own padding to it stacks two paddings and shows up as a dead strip visibly larger than
           the thing it is avoiding (measured on a punch-hole device: the camera band is 49 CSS px, the
           reserved strip was 61). max() means "at least my 12px of breathing room, or the platform's
           number where that is larger" — which is the behaviour both cases actually want, and it still
           collapses to a plain 12px on a shell with no insets.
         */
         /*
           The vars carry the pre-configured default until a real measurement replaces them (see
           :root and the JS). env() is not read directly here on purpose: it is 0 for the whole first
           load on Android, so using it as the fallback would defeat the default.

           The transition is what makes the correction acceptable rather than a jolt — when the real
           inset arrives a frame or two in, the layout EASES to it instead of snapping. Cheap, and it
           turns an unavoidable reflow into something that reads as intentional.
         */
         transition: padding var(--sa-settle) ease-out;
         padding: max(12px, var(--sa-top)) max(12px, var(--sa-right))
                  max(12px, var(--sa-bottom)) max(12px, var(--sa-left));
         background: #14161a; color: #e6e6e6;
         font: 13px/1.45 ui-monospace, "Cascadia Mono", Menlo, monospace; }
  /* min-height:0 is load-bearing: without it a flex child refuses to shrink below its content and
     the scrollbar never appears — the classic flexbox overflow trap. */
  #scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  /*
    ⚠ line-height 1.15, not the inherited 1.45, and it is a SAFE-AREA fix rather than typography.
    Measured on a punch-hole device: the padding puts the content BOX exactly at the status-bar edge
    (128 device px, symmetric — 31px above the camera hole, 31px below it), but the first visible GLYPH
    landed ~14px lower because a 1.45 line box adds half its leading above the text. So the gap under
    the cutout read as noticeably larger than the gap above it, and it looked like too much padding
    when the padding was already exact. Tightening the FIRST line box is what makes the visible text
    start where the box does. Body copy keeps the readable 1.45.
  */
  h1 { font-size: 15px; line-height: 1.15; margin: 0 0 2px; color: #7fd1ff; }
  .sub { color: #8b93a1; margin-bottom: 10px; font-size: 11px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  button { flex: 1 1 auto; min-width: 90px; padding: 10px 8px; border-radius: 8px;
           border: 1px solid #333a45; background: #1e232b; color: #e6e6e6; font: inherit; }
  button:active { background: #2b323d; }
  #log { border: 1px solid #262c35; border-radius: 8px; padding: 8px; height: 30vh;
         overflow: auto; background: #0f1114; white-space: pre-wrap; word-break: break-word; }
  .t { color: #5c6672; }
  .out { color: #ffd479; }
  .in  { color: #9cdc8f; }
  .evt { color: #cba6f7; }
  .err { color: #ff6b6b; }
</style>
</head>
<body>
<!-- Everything scrollable lives in here, so the safe-area padding on <body> can never scroll away. -->
<div id="scroll">
<h1>Shenora · mobile shell</h1>
<div class="sub">the same IPC envelope the desktop shell speaks, over HybridWebView</div>
<div class="row">
  <button id="echo">ECHO</button>
  <button id="copy">COPY_TEXT</button>
  <button id="read">READ_CLIPBOARD</button>
  <button id="ui">UI_STATE</button>
</div>
<div class="row">
  <button id="sched">SCHEDULE_DEMO</button>
  <button id="pick">PICK_FILE</button>
  <button id="save">SAVE_TEXT</button>
  <button id="bad">unknown route</button>
</div>
<!--
  DM1 — the media probe. `/media?<payload>` (built by the SHIPPED mediaUrl) is answered by the shell's
  interceptor plus Shenora.Core's file middleware — no media package involved.
  The two clips are the SAME content and differ only in where the mp4 index sits:
    faststart  — index at the front: plays even from a server that ignores Range. The control.
    moov-at-end — index at the end: cannot start at all unless the host answers a range request for
                  the tail. The test. "It played" only means something when these two differ.
  The picture carries a big seconds counter, so a screenshot after SEEK proves the position.
-->
<div class="row">
  <button id="mfast">▶ faststart</button>
  <button id="mtail">▶ moov-at-end</button>
  <button id="mseek">SEEK 48s</button>
  <button id="mwhere">where?</button>
</div>
<!--
  ⚠ There USED to be a `mode` toggle here, choosing whether the host sliced the response body. It is gone
  on purpose: the SHELL's interceptor settles that from the platform (D45), because Android and iOS need
  OPPOSITE answers and an app has no business knowing which one it is on.

  url — what the page ASKS FOR, and this one still earns its place as a control:
    `origin` — a reserved path on the page's own origin. The form that works on BOTH shells.
    `app`    — the custom scheme. Intercepted on both; Android's media pipeline REFUSES it.
    `bundle` — the platform's own static serving of the same file, touching none of our code. If this
               fails too, the file, the codec or the device's media stack is the problem, not us.
-->
<div class="row">
  <button id="murl">url: origin</button>
  <button id="mrange">RANGE test</button>
</div>
<video id="vid" controls playsinline preload="none"
       style="width:100%; max-height:34vh; background:#000; border-radius:8px; margin-bottom:10px;"></video>
<!-- 🔴 AN AUDIO ELEMENT, because <video> and <audio> background DIFFERENTLY on iOS and only one of them
     can demonstrate the host is configured correctly.
     iOS PAUSES a <video> when the app is backgrounded — the video track cannot render — so testing
     background playback with the element above measures that pause and says nothing about the shell.
     An <audio> already playing CONTINUES, given UIBackgroundModes=audio plus an active
     AVAudioSession(.playback), which is the pair a public sibling proved on a device for its player.
     It plays the SAME clip: those files carry an AAC track, so this is the same bytes over the same
     route, differing only in the element that consumes them. -->
<div class="row">
  <button id="maud">♪ audio only (background test)</button>
</div>
<audio id="aud" controls preload="none" style="width:100%; margin-bottom:10px;"></audio>
<div id="log"></div>
</div><!-- /#scroll -->

<script type="module">
// This page speaks the envelope by hand — a real app uses `@shenora/react`'s bridge, which does
// correlation, timeouts and category routing. What it does NOT hand-write is the TRANSPORT: it
// imports the shipped `createHostTransport()` from the published package, so the code carrying
// bytes on this device is the code an adopter gets, not a copy of it.
//
// dist/transport.js is dependency-free ESM, which is why a plain file drop works here with no
// bundler. If it is absent (a fresh clone that has not built the npm package), the inline fallback
// below keeps the sample runnable — and the log says which one is in use, because "it works" means
// different things for the two.
const logEl = document.getElementById('log');
let seq = 0;
const pending = new Map();

function log(cls, text) {
  const time = new Date().toISOString().substr(11, 8);
  logEl.insertAdjacentHTML('beforeend', `<div><span class="t">${time}</span> <span class="${cls}">${text}</span></div>`);
  logEl.scrollTop = logEl.scrollHeight;
  mirrorToHost(text);
}

// ── page state as TEXT, not pixels ───────────────────────────────────────────────────────────────
// Sends every page log line to the host, which writes it to the DEVICE log — so `dev.mjs mac log` and
// `android log` can be grepped for it. A screenshot cannot report a number, a header or an array, and
// reading those off pixels is what made the DM1 media work slow.
//
// ⚠ `console.log` was tried FIRST and does not work: WebKit does not forward a page's console to the
// unified log (measured on the simulator — a tagged line, zero hits). Hence the IPC route.
//
// ⚠⚠ TWO recursion traps, and both bite instantly if you route this through post()/log():
//   1. post() CALLS log(), so a mirror inside log() would log→post→log forever. This sends on the raw
//      channel itself and never calls log().
//   2. The host ANSWERS every request, and the response handler calls log() — so the reply to a mirrored
//      line would mirror again, and the host would answer that. The `d`-prefixed id below is what the
//      response handler uses to drop these silently.
let diagSeq = 0;
let diagReported = false;
function mirrorToHost(text) {
  try {
    channel.post(JSON.stringify({
      id: `d${++diagSeq}`, module: 'PAGE_DIAG', type: 'LOG',
      payload: { text }, timestamp: new Date().toISOString(),
    }));
  } catch { /* the channel may not exist yet during boot — a lost diagnostic must never break the page */ }
}

/** The last-resort channel, used only when the shipped package has not been built. */
const inlineTransport = {
  post: (message) => window.HybridWebView.SendRawMessage(message),
  subscribe: (listener) => {
    const handler = (e) => { if (typeof e.detail?.message === 'string') listener(e.detail.message); };
    window.addEventListener('HybridWebViewMessageReceived', handler);
    return () => window.removeEventListener('HybridWebViewMessageReceived', handler);
  },
};

let channel = inlineTransport;
let channelSource = 'INLINE fallback (dist/transport.js was not bundled)';
try {
  const shipped = await import('./shenora/transport.js');
  const detected = shipped.createHostTransport();
  if (detected) {
    channel = detected;
    channelSource = `SHIPPED @shenora/react transport (isShenoraAvailable=${shipped.isShenoraAvailable()})`;
  }
} catch {
  // Absent or unparseable — the fallback above stands, and the log below says so.
}

function post(module, type, payload) {
  const id = `c${++seq}`;
  // ISO string, NOT Date.now(). The envelope's `timestamp` is a DateTimeOffset host-side and the
  // kit's own client sends `new Date().toISOString()` (bridge.ts). Epoch milliseconds got the whole
  // request dropped at the boundary with "The JSON value could not be converted to
  // System.DateTimeOffset" — correctly logged host-side and, correctly, invisible to the page.
  const request = { id, module, type, payload, timestamp: new Date().toISOString() };
  log('out', `-> ${module}/${type} ${payload ? JSON.stringify(payload) : ''}`);
  channel.post(JSON.stringify(request));
  return id;
}

/**
 * The host driving this page's media element, installed further down where `vid` exists.
 *
 * ⚠ A HOLDER rather than a direct call, and the reason is this module's evaluation order: `vid` is
 * declared hundreds of lines below and `const`/`let` are in the temporal dead zone until then, so a
 * notification arriving during the initial evaluation would throw a ReferenceError inside the transport's
 * own listener. Null until the media section runs, and events before that are ordinary log lines.
 *
 * A second `channel.subscribe(...)` beside the media code would also work — every transport adds its own
 * listener per call and returns an unsubscribe — but it would re-parse every inbound message to read the
 * few that are the player's. This dispatches from the parse that already happened.
 */
let playerCommand = null;

channel.subscribe((raw) => {
  let msg;
  try { msg = JSON.parse(raw); }
  catch { log('err', `<- unparseable: ${raw}`); return; }

  // The host answers a request with a response envelope and pushes events as a NOTIFICATION BATCH
  // (always a batch, even of one — the kit's rule). `category` is what discriminates them.
  if (msg.category === 'notification') {
    for (const n of (msg.payload ?? [])) {
      log('evt', `<= EVENT ${n.module}/${n.type} ${n.payload ? JSON.stringify(n.payload) : ''}`);
      if (n.module === 'SHENORA.MEDIA' && playerCommand) playerCommand(n);
    }
    return;
  }
  // Drop the host's replies to our own mirrored log lines. Logging them would call log(), which
  // mirrors, which the host would answer — an endless round trip. See mirrorToHost.
  //
  // ⚠ But report the FIRST one, ONCE. A channel that silently swallows its own failure is worse than
  // no channel: the mirror looked simply "not wired" for a whole round of debugging because every
  // reply — including the error explaining why — was being dropped here. One-shot, so it cannot loop.
  if (typeof msg.id === 'string' && msg.id.startsWith('d')) {
    if (!diagReported) {
      diagReported = true;
      const verdict = msg.success === false
        ? `FAILED ${msg.error?.code ?? '?'}${msg.error?.parameters ? ' ' + JSON.stringify(msg.error.parameters) : ''}`
        : 'ok';
      log('t', `page→host log channel: ${verdict} (reported once)`);
    }
    return;
  }

  if (msg.success === false) {
    log('err', `<- FAIL ${msg.id} ${msg.error?.code}${msg.error?.parameters ? ' ' + JSON.stringify(msg.error.parameters) : ''}`);
  } else {
    log('in', `<- OK ${msg.id} ${msg.data !== undefined && msg.data !== null ? JSON.stringify(msg.data) : '(no data)'}`);
  }
});

// Every route below is a REAL one on PortableSampleFacade — the same net10.0 assembly the desktop
// sample hosts. The first version of this page invented a PATHS button and got a textbook
// NO_HANDLER back, which was the error boundary working correctly and the page being wrong.
// Shell-neutral strings: this page now runs on Android AND iOS, and "hello from android" showing up
// in an iPhone screenshot is a small lie of exactly the kind a shared bundle invites.
document.getElementById('echo').onclick  = () => post('SAMPLE_LOGIC', 'ECHO', { text: 'hello from the mobile shell' });
document.getElementById('copy').onclick  = () => post('SAMPLE_LOGIC', 'COPY_TEXT', { text: 'copied on the mobile shell' });
document.getElementById('read').onclick  = () => post('SAMPLE_LOGIC', 'READ_CLIPBOARD');
document.getElementById('ui').onclick    = () => post('SAMPLE_LOGIC', 'UI_STATE');
document.getElementById('sched').onclick = () => post('SAMPLE_LOGIC', 'SCHEDULE_DEMO');
document.getElementById('pick').onclick  = () => post('SAMPLE_LOGIC', 'PICK_FILE');
// SAVE_TEXT is the same route the desktop calls. Success with a NULL filePath is the correct mobile
// answer — the destination is a system grant, not an address — so the page must not read the missing
// path as failure.
document.getElementById('save').onclick  = () => post('SAMPLE_LOGIC', 'SAVE_TEXT', { text: 'saved from the mobile shell' });
document.getElementById('bad').onclick   = () => post('SAMPLE_LOGIC', 'NO_SUCH_ROUTE');

// ── DM1: media over the resource seam ────────────────────────────────────────────────────────────
// The URL is written with the trailing slash the platform inserts anyway (`app://media?x` arrives as
// `app://media/?x`). The host matches a parsed Uri, so either form works; this one just says out loud
// what actually goes over the wire.
const vid = document.getElementById('vid');
const URLS = ['origin', 'app', 'bundle'];
let urlForm = URLS[0];
const urlBtn = document.getElementById('murl');
urlBtn.onclick = () => {
  urlForm = URLS[(URLS.indexOf(urlForm) + 1) % URLS.length];
  urlBtn.textContent = `url: ${urlForm}`;
  log('t', `url form -> ${urlForm}`);
};

/**
 * The media URL comes from the SHIPPED package — `mediaUrl()` in @shenora/react — not from a copy of its
 * encoding. The page hand-rolled the same base64url for one commit and immediately drifted from the host's
 * route (it kept writing /video? after the host moved to /media?), which is precisely the bug a sample using
 * the real thing cannot have.
 *
 * ⚠ The result is RELATIVE, and that is the whole point: it resolves to app://0.0.0.1/media?… on iOS -- the
 * only scheme iOS intercepts -- and https://0.0.0.1/media?… on Android, whose media pipeline refuses a
 * non-standard scheme. Both fixed forms fail on exactly one platform, in opposite directions.
 */
let mediaUrl = null;
try {
  ({ mediaUrl } = await import('./shenora/media.js'));
  log('t', 'mediaUrl: SHIPPED @shenora/react');
} catch {
  log('err', 'mediaUrl: dist/media.js was not bundled — build the npm package');
}

function clipUrl(name) {
  // Cache-bust every load, or the webview answers a reload from its own copy and the host never sees the
  // request — which reads exactly like "the handler stopped being called".
  const bust = Date.now();
  if (urlForm === 'bundle') return `media/${name}?n=${bust}`;   // the platform's own serving, no host code
  if (!mediaUrl) return '';
  const url = mediaUrl({ src: name, n: bust });
  // `app` keeps a literal scheme deliberately, as the control that shows why relative is required.
  return urlForm === 'app' ? `app://0.0.0.1${url}` : url;
}

function loadClip(name) {
  const url = clipUrl(name);
  log('t', `video.src = ${url}`);
  vid.src = url;
  vid.load();
  // A REAL button click is a user gesture, so autoplay policy does not block this — measured on
  // Android/WebView 133 with a genuine touch and with trusted CDP input: both play unmuted.
  // ⚠ An INJECTED click() is not: it is isTrusted:false and grants no user activation, so a harness
  // driving this button sees NotAllowedError and that is the platform behaving correctly rather than a
  // fault. This comment used to say "a rejection here is a real failure", and that sent a probe's
  // correct-behaviour verdict to TASKS.md as a shell divergence. The rejection stays visible either
  // way — a silent catch is how "it just does not play" becomes a half-hour of guessing.
  vid.play().then(() => log('in', 'play() resolved')).catch(err => log('err', `play() REJECTED: ${err}`));
}

vid.addEventListener('loadedmetadata', () =>
  log('in', `loadedmetadata — duration=${vid.duration.toFixed(2)}s ${vid.videoWidth}x${vid.videoHeight}`));
vid.addEventListener('seeked', () => log('in', `seeked -> currentTime=${vid.currentTime.toFixed(2)}s`));
vid.addEventListener('error', () => {
  const e = vid.error;
  log('err', `video ERROR code=${e ? e.code : '?'} ${e && e.message ? e.message : ''}`);
});
// `duration` being Infinity/NaN is the tell for "the player never learned the length" — the exact
// failure mode iOS's two-byte `bytes=0-1` probe walks into when Content-Range does not come back.
document.getElementById('mfast').onclick  = () => loadClip('clip-faststart.mp4');
document.getElementById('mtail').onclick  = () => loadClip('clip-tailmoov.mp4');

// Give the element a SOURCE at startup, without playing it.
//
// The element renders `controls`, so it shows a play button from the moment the page loads — and with no
// src that button does nothing at all. Tapping it is the first thing anyone tries, and "the sample's video
// does not play" is exactly what a dead native control looks like, even though every button beside it
// works. Measured on a device: the ▶ buttons decoded and played fine the whole time.
//
// preload stays 'none', so this costs no bytes until something actually asks for them — it only means the
// native control has a source to start.
if (mediaUrl) {
  vid.src = clipUrl('clip-faststart.mp4');
  log('t', 'video preloaded with clip-faststart.mp4 — the native ▶ works, or use the buttons above');
}

// The AUDIO path — the one that can actually be backgrounded on iOS. Same clip, same route, different
// element. Errors are surfaced rather than swallowed, for the same reason loadClip() surfaces them.
const aud = document.getElementById('aud');
aud.addEventListener('error', () => {
  const e = aud.error;
  log('err', `audio ERROR code=${e ? e.code : '?'} ${e && e.message ? e.message : ''}`);
});
aud.addEventListener('playing', () => log('in', `audio playing — t=${aud.currentTime.toFixed(2)}s`));
aud.addEventListener('pause',   () => log('in', `audio PAUSED — t=${aud.currentTime.toFixed(2)}s`));
document.getElementById('maud').onclick = () => {
  aud.src = clipUrl('clip-faststart.mp4');
  aud.load();
  log('out', 'audio: play — now background the app; it should keep going');
  aud.play().then(() => log('in', 'audio play() resolved')).catch(err => log('err', `audio play() REJECTED: ${err}`));
};
if (mediaUrl) aud.src = clipUrl('clip-faststart.mp4');

// 🔴 THE BACKGROUND MEASUREMENT, and it works BECAUSE this timer stops.
//
// iOS suspends a backgrounded page's timers, so these lines simply stop appearing while the app is away —
// which makes the GAP between two of them the background window, measured rather than assumed. What
// settles the question is the jump in `t` ACROSS that gap: audio that kept playing advances by the length
// of the gap, audio that was stopped advances by nothing. Neither can be seen from a screenshot, and
// `play()` resolving proves only that playback STARTED.
//
// ⚠ It logs only while playing, so an idle app is not noisy.
setInterval(() => { if (!aud.paused) log('in', `audio t=${aud.currentTime.toFixed(2)}s`); }, 2000);

// ── Keeping playback alive across a background, by HANDING OFF video -> audio ────────────────────
//
// 🔴 MEASURED 2026-08-12 AND IT DOES NOT WORK. This block is kept as the DEMONSTRATION of why, because
// it is the first thing anyone tries and the reason it fails is not obvious.
//
// It exists because of a platform rule: a <video> is PAUSED when the app is backgrounded (the video track
// cannot render), while an <audio> already playing keeps going. So the handoff copies the playhead onto
// the <audio>, starts it, and pauses the <video>.
//
// **The start is REFUSED.** On Android/WebView 133:
//     handoff -> audio at 44.12s (app hiding)
//     play() REJECTED: NotAllowedError: play() can only be initiated by a user gesture
// The tap that started the video granted user activation, and activation is TRANSIENT — it was gone
// long before the user pressed HOME. So `visibilitychange` is not "too late to start audio in the
// background"; it is a play() with no activation, which is the ordinary autoplay policy. Pressing HOME is
// not a gesture on this page and never can be.
//
// 🔴 AND EVEN AN ALREADY-PLAYING <audio> IS NOT ENOUGH ON ANDROID: measured twice, it advances ~15.3–15.6 s
// while hidden and then PAUSES mid-clip (`t=20.30` of 60, `ended=false`). The process is suspended; no
// amount of page code prevents that.
//
// **So the page cannot solve background playback here — it needs a NATIVE anchor**, which is what
// `IPlaybackSession` (MediaSession) and `IMediaPlayer` are for. That is the kit's thesis rather than a
// workaround: this is a thing .NET can do and JavaScript cannot.
let handedOff = false;

// 🔴 THE HOST STILL NEEDS THE PLAYHEAD BEFORE THE APP HIDES — but the page no longer publishes a private
// snapshot for it. That was `window.__shenoraLastPlay`, written on `timeupdate`, and it existed only
// because the probe reading it was raw JS with no access to kit state.
//
// The ORDERING REQUIREMENT it solved is real and unchanged: `visibilitychange` fires BEFORE MAUI's
// `Window.Stopped`, and the platform pauses a backgrounded <video> on its own, so by the time the host is
// told the app stopped, the element's LIVE state reads `paused` for a video that was playing a second ago.
//
// What replaced it is the kit's own player: `PLAYER_REPORT` above feeds `IMediaPlayer.Status`, which keeps
// the last reported position across that pause, and `BackgroundPlaybackTransfer` reads it there. One
// playhead, owned by the host, instead of a page global only one probe knew about.

// ── THE PAGE HALF OF THE MEDIA PLAYER, which this sample had never wired ──────────────────────────────
//
// 🔴 The kit's page-backed `IMediaPlayer` learns the playhead from HERE and nowhere else — an app that
// never reports leaves `Status` at `Empty` forever, and anything reading it (notably
// `BackgroundPlaybackTransfer`) then does nothing at all, SILENTLY. This sample drove a bare <video> for
// its whole life because its probes test the ROUTE; that made it the one app that could not consume the
// kit's own player.
//
// A React app gets this for free from `useMediaPlayer(ref)` in `@shenora/react`. This is the same contract
// by hand, which is also what makes it worth having in the sample: it shows an adopter with no React what
// the hook actually does.
//
// ⚠ Report on TRANSITIONS plus `timeupdate` — the element fires that ~4x a second, which is the rate the
// host wants for a position and far below anything that needs throttling.
const reportPlayer = (state, error) => {
  try {
    channel.post(JSON.stringify({
      id: `m${++diagSeq}`, module: 'SHENORA.MEDIA', type: 'PLAYER_REPORT',
      payload: {
        state,
        // SECONDS on the wire. `duration` is legitimately NaN before metadata lands and Infinity for a
        // live stream, and the host guards both — but sending null is the honest form.
        position: vid.currentTime,
        duration: Number.isFinite(vid.duration) ? vid.duration : null,
        // A rejected play() has no `MediaError` at all, so the caller's reason wins when it has one.
        error: error ?? (vid.error ? `MEDIA_ERR_${vid.error.code}` : null),
      },
      timestamp: new Date().toISOString(),
    }));
  } catch { /* the channel may not exist during boot — a lost report must never break playback */ }
};

vid.addEventListener('loadedmetadata', () => reportPlayer('Opening'));
vid.addEventListener('playing', () => reportPlayer('Playing'));
vid.addEventListener('pause', () => reportPlayer(vid.ended ? 'Ended' : 'Paused'));
vid.addEventListener('ended', () => reportPlayer('Ended'));
vid.addEventListener('error', () => reportPlayer('Failed'));
vid.addEventListener('timeupdate', () => { if (!vid.paused && !vid.ended) reportPlayer('Playing'); });

// ── AND THE OTHER HALF: THE HOST DRIVING THIS ELEMENT ─────────────────────────────────────────────
//
// 🔴 REPORTING ALONE IS HALF A CONTRACT, and the missing half fails exactly as silently as the missing
// reports did. `IMediaPlayer.SeekAsync`/`PlayAsync` on the host EMIT `PLAYER_SEEK`/`PLAYER_PLAY` as
// events; with nothing subscribed here, `BackgroundPlaybackTransfer.ToForegroundAsync` completes, reports
// `Resumed` with a position, and moves nothing at all. The handoff would have looked like it worked and
// the handback would have quietly dropped the film.
//
// A React app gets this from `useMediaPlayer(ref)`; this is the same host→element half by hand, and it is
// the reason the page can now be driven by the kit instead of by a probe's private copy of the logic.
playerCommand = (n) => {
  const p = n.payload ?? {};
  switch (n.type) {
    case 'PLAYER_LOAD':
      vid.src = p.uri ?? '';
      // load() rather than trusting the src assignment: a second load on the same element keeps the
      // previous buffer, and a seek then lands in the OLD media.
      vid.load();
      if (p.startAt > 0) {
        // `loadedmetadata` is the earliest point currentTime is settable — before it the assignment is
        // silently dropped and the item starts at zero.
        vid.addEventListener('loadedmetadata', () => { vid.currentTime = p.startAt; }, { once: true });
      }
      break;
    // ⚠ A refusal is REPORTED, never swallowed: returning to the foreground is not a user gesture, and if
    // the element has lost its activation the host must hear `Failed` rather than believe playback resumed.
    case 'PLAYER_PLAY':
      vid.play().catch(err => {
        log('err', `PLAYER_PLAY refused: ${err}`);
        reportPlayer('Failed', (err && err.name) ? err.name : 'PlayRejected');
      });
      break;
    case 'PLAYER_PAUSE': vid.pause(); break;
    case 'PLAYER_SEEK': vid.currentTime = p.position ?? 0; break;
    case 'PLAYER_RATE': vid.playbackRate = p.rate ?? 1; break;
    case 'PLAYER_UNLOAD':
      vid.pause();
      vid.removeAttribute('src');
      // load() after clearing src is what actually FREES the decoded buffer — on a phone that is the
      // difference between releasing memory and not.
      vid.load();
      reportPlayer('Empty');
      break;
  }
};

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (vid.paused || vid.ended || !vid.currentSrc) return;
    handedOff = true;
    const at = vid.currentTime;
    if (aud.currentSrc !== vid.currentSrc) aud.src = vid.currentSrc;
    aud.currentTime = at;
    log('out', `handoff -> audio at ${at.toFixed(2)}s (app hiding)`);
    aud.play()
      .then(() => log('in', 'handoff: audio took over'))
      .catch(err => log('err', `handoff REJECTED: ${err} — no user activation survives to here`));
    // ⚠ It does NOT pause the <video> any more. The platform does that itself, and doing it here ALSO
    // destroyed the state the host's handoff reads — two owners of one element, and the second one lost.
  } else if (handedOff) {
    handedOff = false;
    aud.pause();
    // ⚠ NO handback from here any more. The HOST owns the return trip now (BackgroundHandoffProbe, wired to
    // Window.Resumed): it reads the position off the native player and drives this element. Two things
    // resuming one <video> would race, and the loser would look like a bug in whichever ran second.
    log('out', 'handback deferred to the host — it has the real position from the native player');
  }
});
document.getElementById('mseek').onclick  = () => {
  log('out', `seeking to 48s (from ${vid.currentTime.toFixed(2)}s, duration=${vid.duration})`);
  vid.currentTime = 48;
};
// The INSTRUMENT, added after the media pipeline gave two different failures on the same file and
// inference could not separate them. `fetch` with an explicit Range takes the demuxer out of the
// picture entirely and asks the one question that matters: does a SUB-RANGE — a 206 starting at a
// non-zero offset — arrive intact, with its Content-Range, at the requested offset?
//
// `bytes=4-11` is the check that a byte OFFSET is honoured rather than merely a length: those eight
// bytes of any mp4 are the ASCII "ftypisom". A length-only assertion passes just as happily on the
// wrong slice, which is how a seam that silently serves from 0 looks correct.
document.getElementById('mrange').onclick = async () => {
  const url = clipUrl('clip-faststart.mp4');
  for (const spec of ['bytes=4-11', 'bytes=1000-1099', 'bytes=474000-']) {
    try {
      const r = await fetch(url, { headers: { Range: spec } });
      const buf = new Uint8Array(await r.arrayBuffer());
      const ascii = Array.from(buf.slice(0, 8)).map(b => (b >= 32 && b < 127) ? String.fromCharCode(b) : '.').join('');
      const cls = r.status === 206 ? 'in' : 'err';
      log(cls, `RANGE ${spec} -> status=${r.status} CR=${r.headers.get('Content-Range')} ` +
               `got=${buf.byteLength}B first8="${ascii}"`);
    } catch (err) {
      log('err', `RANGE ${spec} -> threw ${err}`);
    }
  }
};

document.getElementById('mwhere').onclick = () => {
  const b = vid.buffered;
  const ranges = [];
  for (let i = 0; i < b.length; i++) ranges.push(`${b.start(i).toFixed(1)}-${b.end(i).toFixed(1)}`);
  log('t', `currentTime=${vid.currentTime.toFixed(2)}s duration=${vid.duration} ` +
           `paused=${vid.paused} readyState=${vid.readyState} buffered=[${ranges.join(' ')}]`);
};

// The handshake. Until this lands the host BUFFERS notifications rather than dropping them, which
// is why the tick events that fired before this point still arrive.
log('t', `channel: ${channelSource}`);

// ── The SEGMENT route's page half, defined HERE rather than injected ───────────────────────────────
//
// 🔴 It lives in the page because `EvaluateJavaScriptAsync` is not a good way to ship a 4 KB script:
// `PageProbe.Safe()` flattens it to one line (so a `//` comment swallows the rest), the whole thing is
// then re-escaped by MAUI, and a failure comes back as a bare null that says nothing about where. The
// host now evaluates ONE short call instead, which is the pattern `mobile-shells.md` recommends —
// heavy logic in the page, results over the IPC log mirror.
//
// It parks its answer in a slot the host polls, because EvaluateJavaScriptAsync does not await promises.
window.__shenoraSegCheck = function (base, mime) {
  window.__shenoraSegProbe = 'pending';
  (async () => {
    const out = [];
    const say = (k, v) => out.push(k + '=' + v);
    const done = () => { window.__shenoraSegProbe = out.join('|'); };
    // Poll a resource the ENGINE has to produce: 503 means "not ready", which is the route working.
    const fetchProduced = async (url, label) => {
      for (let attempt = 0; attempt < 60; attempt++) {
        const r = await fetch(url);
        if (r.status === 200) return new Uint8Array(await r.arrayBuffer());
        if (r.status !== 503) { say(label, 'status ' + r.status); return null; }
        await new Promise(res => setTimeout(res, 1000));
      }
      say(label, 'NEVER-READY');
      return null;
    };
    try {
      const m = await fetch(base + 'index.m3u8');
      say('manifest', m.status);
      if (!m.ok) return done();
      const text = await m.text();
      say('version', /#EXT-X-VERSION:(\d+)/.exec(text)?.[1] ?? 'none');
      const initName = /#EXT-X-MAP:URI="([^"]+)"/.exec(text)?.[1] ?? null;
      say('map', initName ?? 'MISSING');
      const segs = text.split('\n').filter(l => l.trim() && !l.startsWith('#'));
      say('segments', segs.length);
      if (!initName || !segs.length) return done();

      const init = await fetchProduced(base + initName, 'init');
      if (!init) return done();
      say('initBytes', init.length);
      const seg = await fetchProduced(base + segs[0], 'seg0');
      if (!seg) return done();
      say('seg0Bytes', seg.length);

      /* THE APPEND — the only part a device is required for. */
      const Src = window.ManagedMediaSource ?? window.MediaSource;
      if (!Src) { say('append', 'NO-MEDIASOURCE'); return done(); }
      const mime = 'video/mp4; codecs="avc1.640028"';
      say('typeSupported', Src.isTypeSupported ? Src.isTypeSupported(mime) : 'n/a');
      const ms = new Src();
      const el = document.createElement('video');
      el.muted = true; el.playsInline = true; el.disableRemotePlayback = true;
      el.srcObject = ms;
      document.body.appendChild(el); el.style.width = el.style.height = '1px';
      let started = 0, ended = 0;
      ms.addEventListener('startstreaming', () => started++);
      ms.addEventListener('endstreaming', () => ended++);
      el.play().catch(() => {});
      const opened = await new Promise(res => {
        if (ms.readyState === 'open') return res(true);
        ms.addEventListener('sourceopen', () => res(true), { once: true });
        setTimeout(() => res(false), 5000);
      });
      say('sourceopen', opened);
      if (!opened) { el.remove(); return done(); }
      let sb;
      try { sb = ms.addSourceBuffer(mime); }
      catch (e) { say('addSourceBuffer', 'THREW ' + e.name); el.remove(); return done(); }
      const append = (bytes) => new Promise((res) => {
        sb.addEventListener('updateend', () => res('ok'), { once: true });
        sb.addEventListener('error', () => res('error'), { once: true });
        try { sb.appendBuffer(bytes); } catch (e) { res('threw ' + e.name); }
      });
      say('appendInit', await append(init));
      say('appendSeg0', await append(seg));
      /* Buffered range is the honest proof: an append that "succeeded" and buffered nothing is the
         silent failure this whole probe exists for. */
      const b = sb.buffered;
      say('buffered', b.length ? b.start(0).toFixed(2) + '-' + b.end(0).toFixed(2) : 'EMPTY');
      say('startstreaming', started);
      say('endstreaming', ended);
      el.remove();
    } catch (err) {
      say('threw', (err && err.name) ? err.name : String(err));
    }
    done();
  })();
  return 'started';
};

// ── MSE-PROBE: what this shell's MediaSource actually IS, and whether it TALKS ─────────────────────
//
// 🔴 D71 piece 4's stated prerequisite: "Confirm iOS's ManagedMediaSource streaming signals on the
// simulator before relying on them; nothing in this repo has verified them." `nextSegment` in
// @shenora/react refuses to fetch while a managed source has said stop, so if those events never
// arrive the binder would fetch NOTHING and the failure would be a video that silently never starts.
//
// ⚠ EXISTENCE IS NOT THE QUESTION. `typeof window.ManagedMediaSource` is cheap and nearly worthless —
// this repo already has a measured case of a capability query answering `true` for something that
// does not work (`isTypeSupported('video/mp2t')` on both shells, which the knowledge file says not to
// believe). So this ATTACHES one to a real element and waits for the event, and reports what it saw
// rather than what was advertised.
(async () => {
  const has = (n) => typeof window[n] === 'function';
  const Managed = window.ManagedMediaSource;
  log('t', `MSE-PROBE: MediaSource=${has('MediaSource')} ManagedMediaSource=${has('ManagedMediaSource')}`);

  // The MIME @shenora/react's segmentMimeType() builds, asked of whichever implementation exists.
  const mime = 'video/mp4; codecs="avc1.640028,mp4a.40.2"';
  const src = Managed ?? window.MediaSource;
  if (!src) { log('err', 'MSE-PROBE: no MediaSource of either kind — the binder cannot work here'); return; }
  log('t', `MSE-PROBE: isTypeSupported(fMP4 h264+aac) = ${src.isTypeSupported ? src.isTypeSupported(mime) : 'n/a'}`);

  if (!Managed) { log('t', 'MSE-PROBE: standard MediaSource — no streaming events to confirm'); return; }

  // The real question. A ManagedMediaSource only wants data between `startstreaming` and
  // `endstreaming`; attach one to an element and see whether it ever asks.
  try {
    const ms = new Managed();
    const el = document.createElement('video');
    el.muted = true;
    el.playsInline = true;
    // ⚠ `srcObject`, not createObjectURL: a managed source attached by URL does not get the
    // lifecycle it manages, and Apple's own guidance is the object form.
    el.srcObject = ms;
    // ⚠ Also load-bearing per Apple's docs — without it the element may never enter the state that
    // makes the source ask for data at all.
    el.disableRemotePlayback = true;
    document.body.appendChild(el);
    el.style.width = el.style.height = '1px';

    let opened = false, started = 0, ended = 0;
    ms.addEventListener('sourceopen', () => { opened = true; });
    ms.addEventListener('startstreaming', () => { started++; });
    ms.addEventListener('endstreaming', () => { ended++; });
    el.play().catch(() => { /* autoplay refusal is not what this measures */ });

    // Report at 2s and again at 6s: `startstreaming` is not promised to be immediate, and a probe
    // that looked once would report "never fires" for an event that was merely late.
    const report = (when) => log('t',
      `MSE-PROBE @${when}: sourceopen=${opened} startstreaming=${started} endstreaming=${ended} `
      + `readyState=${ms.readyState} streaming=${'streaming' in ms ? ms.streaming : 'n/a'}`);
    setTimeout(() => report('2s'), 2000);
    setTimeout(() => {
      report('6s');
      log('t', started > 0
        ? 'MSE-PROBE: VERDICT startstreaming FIRES — nextSegment’s gate is real'
        : 'MSE-PROBE: VERDICT startstreaming NEVER FIRED in 6s — a gated binder would fetch nothing');
      el.remove();
    }, 6000);
  } catch (err) {
    log('err', `MSE-PROBE: constructing a ManagedMediaSource threw ${err}`);
  }
})();

// ── Safe-area insets: MEASURE them, and KEEP measuring ────────────────────────────────────────────
//
// 🔴 THE FIRST SCREEN WAS WRONG AND THIS IS WHY. On Android the insets are **0 for the whole of the
// first page load** and only appear on a later one — measured, not inferred: this probe logged
// `top=0 right=0 bottom=0 left=0` on the initial load and `top=49` after the reload probe navigated.
// A page that reads env() once, at parse time, therefore lays out its first screen against zero and
// never corrects, because within that load nothing changes to trigger a reflow.
//
// So the values are re-read whenever the viewport can have changed and published as CSS variables the
// stylesheet prefers over the raw env(). This costs nothing where env() is already right — the numbers
// simply match — and it is what makes the FIRST screen correct rather than the second.
//
// ⚠ It does NOT fix everything. Android reports only the display CUTOUT here, never the system bars:
// measured `bottom=0` on a device whose navigation bar is genuinely 24 CSS px tall, so content still
// sits under the gesture pill and no amount of CSS or JS in the page can discover that. That half needs
// the HOST to hand the page its `WindowInsetsCompat` — see `.claude/knowledge/mobile-shells.md`.
const readInsets = (announce) => {
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;'
    + 'padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);'
    + 'padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);';
  document.body.appendChild(probe);
  const s = getComputedStyle(probe);
  const px = (v) => Math.round(parseFloat(v) || 0);
  const v = { top: px(s.paddingTop), right: px(s.paddingRight),
              bottom: px(s.paddingBottom), left: px(s.paddingLeft) };
  probe.remove();

  // ⚠ ONLY overwrite the pre-configured defaults once the platform has said something real. On Android
  // every reading is 0 for the whole first load, and writing those zeros back would replace a sensible
  // default with a wrong measurement — the exact regression this default exists to prevent. A shell
  // that genuinely has no insets is therefore left at the default until it reports; that is the right
  // way round, because over-reserving is a cosmetic 24px and under-reserving hides content behind the
  // status bar.
  const real = v.top || v.right || v.bottom || v.left;
  if (real) {
    const root = document.documentElement.style;
    for (const side of ['top', 'right', 'bottom', 'left']) root.setProperty(`--sa-${side}`, `${v[side]}px`);
  }
  if (announce) {
    // BOTH numbers, because they answer different questions and confusing them wasted a session.
    // `env` is what the web platform reports — 0 on Android for the whole first load, and cutout-only
    // after that. `var` is what the SHELL published and therefore what the page actually laid out
    // with. A gate that only printed env() would have shown zeros while the layout was correct.
    const rs = getComputedStyle(document.documentElement);
    const rv = (n) => (rs.getPropertyValue(n).trim() || '(unset)');
    // ⚠ ALL FOUR of the published values, not just top/bottom. Rotation moves an inset to a different
    // EDGE, so a line that prints only the vertical pair cannot tell a correct landscape layout from a
    // stale portrait one — which is exactly the bug this page was used to find (2026-08-06).
    // `orientation` is here for the same reason: the numbers are only interpretable next to it.
    log('t', `insets env: top=${v.top} right=${v.right} bottom=${v.bottom} left=${v.left} · `
      + `laid out with var: top=${rv('--sa-top')} right=${rv('--sa-right')} `
      + `bottom=${rv('--sa-bottom')} left=${rv('--sa-left')} `
      + `color=${rv('--sa-color')} settle=${rv('--sa-settle')} · `
      + `orientation=${innerWidth > innerHeight ? 'landscape' : 'portrait'} `
      + `viewport=${innerWidth}x${innerHeight} dpr=${devicePixelRatio}`);
  }
  return v;
};

let lastInsets = JSON.stringify(readInsets(true));
// resize fires when the window insets finally land; visualViewport catches the keyboard and the
// rotation cases that do not always produce a window resize.
const recheck = () => {
  const now = JSON.stringify(readInsets(false));
  if (now === lastInsets) return;
  lastInsets = now;
  log('t', `insets CHANGED after first paint -> ${now}`);
};
addEventListener('resize', recheck);
visualViewport?.addEventListener('resize', recheck);
// Two early re-reads for the case that produced this: the insets arrive after first paint but without
// any event the page can hear.
requestAnimationFrame(recheck);
setTimeout(recheck, 250);

log('t', 'page loaded — sending handshake');
post('SHENORA', 'READY', { client: 'maui-sample' });

// The handshake's reply carries what the shell can do, so a real page renders its title bar and
// drop zones from DATA rather than from a platform check. This log line stands in for that; the
// desktop sample does the real version in App.tsx, and the two answers to the SAME handshake are
// `maui · [filePicker]` here against `winforms · [windowChrome, dropZones, filePicker,
// folderPicker, savePicker, secondaryWindows, tray]` there.
window.addEventListener('HybridWebViewMessageReceived', function shellProbe(e) {
  try {
    const msg = JSON.parse(e.detail.message);
    if (msg.category === 'ipc' && msg.id === 'c1' && msg.data) {
      log('t', `shell: ${msg.data.name} · capabilities: [${(msg.data.capabilities ?? []).join(', ')}]`);
      window.removeEventListener('HybridWebViewMessageReceived', shellProbe);
    }
  } catch { /* not ours */ }
});
</script>
</body>
</html>
