name: CEF with codecs

# Manual-trigger only, like the release (D5): builds the pinned CEF (src/Shenora.Chromium/cef.json "cef") from source
# with Chromium's proprietary codecs and packs it as Shenora.Chromium.Codecs.win-x64 (engines/, D99), uploaded as a WORKFLOW
# ARTIFACT. It publishes nothing: pushing the package to nuget.org is a person's act (below).
#
# ⚠ NEVER RUN AS THIS WORKFLOW. Its steps are what building the pinned CEF by hand took (about 9 hours on 22 cores, with
# SDK 10.0.28000.0 installed), ending in a distribution the Chromium sample played H.264 + AAC and HEVC from, packed and
# restored through the package; the first real run is the proof of the order of the steps, so read its log. Chromium is
# built from source, so it needs a runner that is not GitHub's hosted one: Windows, Visual Studio 2026 (18) with the
# "Desktop development with C++" workload, **the Windows SDK Chromium's own build/vs_toolchain.py names (10.0.28000.0 for
# Chromium 154)**, ~200 GB free, 32+ GB RAM, git, python 3 and the .NET SDK on PATH, and GYP_MSVS_OVERRIDE_PATH,
# vs2026_install and WINDOWSSDKDIR set in the runner's environment. Register one labelled `cef-builder`.
# Hours per platform, and again at every CEF bump (D81). Only windows64 is built here; the other platforms, and
# macOS/Linux runners, are added when an adopter needs them.
#
# After a green run, by hand:
#   1. Download the artifact; try it: `node devtools/dev.mjs chromium-codecs --source <the folder holding the .nupkg>` must
#      print `CODEC: RESULT PASS` (HEVC is the machine's own decoder: a machine without one fails it alone).
#   2. Push the .nupkg to nuget.org (the package id and the version, which is CEF's, are in engines/*/*.csproj), and run
#      `chromium-codecs` with no extra argument: it restores the published package.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: windows64
    runs-on: [self-hosted, windows, x64, cef-builder]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4

      - name: Read the pin
        id: pin
        shell: bash
        run: |
          cef=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('src/Shenora.Chromium/cef.json','utf8')).cef)")
          # 154.0.32+g682c378+chromium-154.0.8037.58: CEF's branch is Chromium's build number (8037), its commit the g-hash.
          echo "cef=$cef" >> "$GITHUB_OUTPUT"
          echo "commit=$(echo "$cef" | sed -E 's/.*\+g([0-9a-f]+)\+.*/\1/')" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "$cef" | sed -E 's/.*chromium-[0-9]+\.[0-9]+\.([0-9]+)\..*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Build CEF with the codecs
        shell: bash
        env:
          GN_DEFINES: is_official_build=true proprietary_codecs=true ffmpeg_branding=Chrome
          DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
          GYP_MSVS_VERSION: '2026'
          # Only the configuration that is built: CEF otherwise generates x86 and arm64 ones, each wanting its own PGO profile.
          GN_OUT_CONFIGS: Release_GN_x64
        run: |
          work="$RUNNER_TEMP/cef-build"
          mkdir -p "$work"
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$work/depot_tools"
          curl -fsSL -o "$work/automate-git.py" https://raw.githubusercontent.com/chromiumembedded/cef/master/tools/automate/automate-git.py
          export PATH="$work/depot_tools:$PATH"
          # automate-git sets checkout_pgo_profiles but never runs the hooks that fetch what an official build reads, so it fails
          # at `gn gen` (Chrome's profile) and at the compile (V8's builtins profile). Fetched here once the source is synced.
          python3 "$work/automate-git.py" --download-dir="$work/download" --depot-tools-dir="$work/depot_tools"             --branch=${{ steps.pin.outputs.branch }} --checkout=${{ steps.pin.outputs.commit }}             --x64-build --no-debug-build --no-chromium-history --with-pgo-profiles --no-build --no-distrib || true
          (cd "$work/download/chromium"             && python3 src/tools/update_pgo_profiles.py --target=win64 update --gs-url-base=chromium-optimization-profiles/pgo_profiles             && python3 src/v8/tools/builtins-pgo/download_profiles.py download --depot-tools "$work/depot_tools" --check-v8-revision --quiet)
          python3 "$work/automate-git.py" --download-dir="$work/download" --depot-tools-dir="$work/depot_tools" \
            --branch=${{ steps.pin.outputs.branch }} --checkout=${{ steps.pin.outputs.commit }} \
            --x64-build --no-debug-build --minimal-distrib-only --no-chromium-history --with-pgo-profiles --force-build

      - name: Pack the engine package
        shell: bash
        run: |
          out="$RUNNER_TEMP/cef-build/download/chromium/src/cef/binary_distrib"
          name="cef_binary_${{ steps.pin.outputs.cef }}_windows64_minimal"
          # The folder's name is the pin's, or the build is not the pinned one. On Windows CEF packs a .zip and leaves the
          # folder, whose Release\ and Resources\ are what the package carries.
          test -d "$out/$name" || { echo "::error::the build produced $(ls "$out") and not $name"; exit 1; }
          dotnet pack engines/Shenora.Chromium.Codecs.win-x64/Shenora.Chromium.Codecs.win-x64.csproj -c Release             "-p:CefDist=$(cygpath -w "$out/$name")" -o dist-out
          ls -l dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: cef-codecs-windows64
          path: dist-out/*.nupkg
          if-no-files-found: error
          retention-days: 14
