name: Release

# Manual-trigger only (family release model). Cutting a release is a deliberate act you start from
# the Actions tab (Run workflow) — there is intentionally NO tag-push / release-published trigger
# and NO push/PR CI (docs/DECISIONS.md D5). The full verify gate runs against the exact commit
# before the irreversible registry pushes, and the version bump is committed only AFTER both
# publishes succeed — a failed release burns no version and leaves no phantom commit.
#
# Publishing:
#  - NuGet uses Trusted Publishing (OIDC) — no stored API key. Setup (once): on nuget.org,
#    Account -> Trusted Publishing -> add a policy for this repository and workflow file
#    `release.yml`, scoped to the Shenora.* package glob.
#  - npm publishes with provenance. Configure npm Trusted Publishing (OIDC) for @shenora/react on
#    npmjs.com (package -> Settings -> Trusted publisher -> this repo + release.yml); until that
#    exists, set a granular NPM_TOKEN repo secret and the publish step uses it instead.
#
# ⚠ `draft: true` is NOT a dry run. It only makes the GITHUB RELEASE a draft — both registry pushes
# happen BEFORE that step and are irreversible (nuget.org never deletes a version, only unlists it;
# npm allows an unpublish only briefly and only for a new package). Use `dry_run: true` to rehearse:
# it runs the gate, the pack and the OIDC login — which is the part actually worth validating, since
# that step exchanges the workflow's token against the trusted-publishing policy and fails loudly if
# the policy is wrong — then publishes nothing and touches no git.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (e.g. 0.2.0) — leave empty to bump'
        required: false
        default: ''
      bump:
        description: 'Bump kind when version is empty'
        type: choice
        options: [none, patch, minor, major]
        default: patch
      create_tag:
        description: 'Create + push the vX.Y.Z tag'
        type: boolean
        default: true
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: true
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        type: boolean
        default: false
      dry_run:
        description: 'DRY RUN — verify + pack + OIDC login, then publish NOTHING and touch no git'
        type: boolean
        default: false

permissions:
  contents: write   # push the version-bump commit + tag, create the release
  id-token: write   # OIDC token for NuGet/npm Trusted Publishing (short-lived — no stored secret)

jobs:
  # The native launcher, built HERE rather than committed. It is the one artifact this repo's own
  # toolchain cannot produce for every target: win-x64 needs MSVC and linux-x64 needs gcc, on two
  # different runners, so no single machine packs both.
  #
  # ⚠ `publish` DEPENDS on this job, which is what makes the failure loud. The earlier shape had the
  # release download artifacts and `pack` merely SKIP the project when they were missing — so a release
  # that forgot the step shipped without the launcher and looked entirely normal. Now the release cannot
  # start until both binaries exist, and a broken launcher stops it before anything is published.
  launcher:
    strategy:
      fail-fast: true   # unlike the standalone `launcher` workflow: a release must not publish half of it
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   exe: shenora-launcher.exe }
          - { os: ubuntu-latest,  rid: linux-x64, exe: shenora-launcher }
    runs-on: ${{ matrix.os }}
    name: launcher (${{ matrix.rid }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The C# half of the update protocol — the conformance harness stages with the REAL
      # implementation, so this is not optional scaffolding.
      - name: Build update-probe
        run: dotnet build devtools/update-probe/update-probe.csproj -c Release --nologo

      - name: Build the launcher
        run: |
          cmake -S src/Shenora.Launcher -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      # A launcher that fails conformance must never reach a package. This is the same harness the
      # standalone workflow runs, against the binary about to be shipped.
      - name: Conformance
        shell: bash
        run: |
          exe=$(find build -name '${{ matrix.exe }}' -type f | head -n1)
          probe=$(find devtools/update-probe/bin/Release -name 'update-probe*' -type f \
                  \( -name '*.exe' -o ! -name '*.*' \) | head -n1)
          ls -l "$exe" | awk '{ printf "size: %d bytes (%.1f KB)\n", $5, $5/1024 }'
          node devtools/scripts/launcher-conformance.mjs "$exe" "$probe"

      - name: Stage the per-RID artifact
        shell: bash
        run: |
          mkdir -p "artifact/runtimes/${{ matrix.rid }}/native"
          cp "$(find build -name '${{ matrix.exe }}' -type f | head -n1)" \
             "artifact/runtimes/${{ matrix.rid }}/native/"

      - uses: actions/upload-artifact@v4
        with:
          name: release-launcher-${{ matrix.rid }}
          path: artifact/
          if-no-files-found: error

  publish:
    needs: launcher
    runs-on: windows-latest   # net10.0-windows targets need Windows to build
    env:
      # This job IS the release, so the bump it makes is authorised. `doctor`'s version-authorship
      # guard asserts VersionPrefix == the newest release tag, which is true BETWEEN releases and
      # deliberately false DURING one: step 1 bumps the props, step 6 creates the tag. Without this
      # the guard fails the release inside `doctor --fix` (it did, on the first 0.4.0 attempt, before
      # anything was published). Job-wide rather than per-step because the Verify gate two steps later
      # runs the same check.
      SHENORA_RELEASE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for release notes

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The mobile TFMs need their workloads, and the runner image cannot be assumed to carry the
      # .NET 10 ones — its published list is the 9.0 `maui.*` set plus Visual Studio component groups.
      # 0.5.0 proved net10.0-android resolved there and proved nothing about iOS, which is not a gap
      # worth discovering during a release.
      #
      # Explicit ids rather than `dotnet workload restore`: restore infers them from the projects,
      # which is self-maintaining but depends on the solution parsing cleanly, and a failure here
      # stops a release for a reason that has nothing to do with the release. KEEP THIS LIST IN STEP
      # with the mobile TFMs in src/Shenora.Android and src/Shenora.iOS.
      #
      # Idempotent and quick when the workloads are already present.
      - name: Install the mobile workloads
        run: dotnet workload install maui-android maui-ios

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Determine version
        id: version
        run: |
          $current = node -e "import('./devtools/project.config.mjs').then(m => console.log(m.default.version))"
          $req = '${{ inputs.version }}'.Trim()
          if ($req) { $final = $req }
          else {
            $parts = $current.Split('.')
            switch ('${{ inputs.bump }}') {
              'none'  { $final = $current }
              'patch' { $parts[2] = [int]$parts[2] + 1; $final = $parts -join '.' }
              'minor' { $parts[1] = [int]$parts[1] + 1; $parts[2] = 0; $final = $parts -join '.' }
              'major' { $parts[0] = [int]$parts[0] + 1; $parts[1] = 0; $parts[2] = 0; $final = $parts -join '.' }
            }
          }
          if ($final -notmatch '^\d+\.\d+\.\d+$') { throw "bad version: $final" }
          # Rewrite VersionPrefix in the WORKING TREE only — the commit is deferred until after
          # the publishes succeed.
          $props = 'src/Directory.Build.props'
          (Get-Content $props -Raw) -replace '<VersionPrefix>[^<]+</VersionPrefix>', "<VersionPrefix>$final</VersionPrefix>" | Set-Content $props -Encoding utf8 -NoNewline

          # Stamp the CHANGELOG's `## Unreleased` heading for this release, exactly as VersionPrefix
          # (above) is. Ported from Lyntai, where this was the one release edit still left to a human
          # and a version shipped with its section titled "Unreleased" because of it. Idempotent, and
          # it never invents prose.
          node devtools/dev.mjs changelog --fix --version $final
          if ($LASTEXITCODE -ne 0) { throw "changelog stamp failed - CHANGELOG.md unreadable or unwritable" }

          # Sync the OTHER derived files (npm package.json version + README `## Status` headline)
          # from the newly-written VersionPrefix. `doctor --fix` is idempotent and the same routine
          # `pack` runs. It has to run HERE, before the Verify gate — verify's doctor is deliberately
          # non-fixing (P5.5 H5: "verify must FAIL on version/README drift rather than leave it to
          # pack"), so leaving the sync in pack alone made every version-BUMPING release fail verify.
          # v0.1.0 dodged this only because that release cut kept VersionPrefix at 0.1.0 (bump=none
          # or an already-matching explicit input) so nothing drifted.
          node devtools/dev.mjs doctor --fix
          if ($LASTEXITCODE -ne 0) { throw "doctor --fix failed - could not sync npm/README from VersionPrefix" }

          # Ask GIT what actually changed rather than comparing version strings. The edits above move
          # independently: re-cutting the SAME version still stamps a heading, and a bump whose
          # changelog was already stamped rewrites only the props. A string compare would skip the
          # commit in the first case and lose the stamp; it would also produce an EMPTY commit on a
          # re-run that rewrote none of them.
          #
          # KEEP THIS LIST AND THE `git add` BELOW IN LOCKSTEP with what `doctor --fix` rewrites.
          # docs/ARCHITECTURE.md joined that set on 2026-08-02 (its status line is version-synced the
          # same way README's headline is); adding it here and NOT to the commit would push a release
          # whose ARCHITECTURE still names the previous version — and `doctor` fails on exactly that,
          # so the next verify on main would be red.
          $changed = if (git status --porcelain -- src/Directory.Build.props CHANGELOG.md README.md docs/ARCHITECTURE.md src/Shenora.React/package.json) { 'true' } else { 'false' }

          "changed=$changed" >> $env:GITHUB_OUTPUT
          "version=$final" >> $env:GITHUB_OUTPUT
          "tag=v$final" >> $env:GITHUB_OUTPUT
          Write-Host "current=$current -> final=$final (release files rewritten: $changed)"

      - name: Verify gate
        # local/sensitive-patterns.txt is gitignored, so the private half of the sensitive guard
        # cannot run here — the pre-commit + commit-msg hooks are its real gate, locally. The scanner
        # now FAILS CLOSED without that file (P5.5 H5), so CI must opt in to a builtins-only scan
        # EXPLICITLY rather than silently getting one.
        #
        # `--release` drops the rule-base checks (knowledge check/footprint): they police this repo's
        # assistant rules, ship nothing, and cannot harm a consumer — but they blocked this release
        # twice on 2026-08-02 while the packages were perfect. Everything that protects the ARTIFACT
        # still runs: build, tests, typechecks, the sensitive scan, doc-drift (the README it checks
        # ships in every nupkg) and doctor.
        env:
          SHENORA_ALLOW_BUILTIN_PATTERNS_ONLY: '1'
        run: node devtools/dev.mjs verify --release

      # Both launcher RIDs, from the matrix job above, merged into the one folder the packaging project
      # reads. `merge-multiple` is what lets two artifacts land in the same runtimes/ tree.
      - name: Download the launcher binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-launcher-*
          merge-multiple: true
          path: src/Shenora.Launcher.Native/artifacts

      # A release must not publish a package set that silently lost one. `pack` SKIPS the launcher
      # project when its binaries are absent — the right behaviour on a dev box, and exactly the wrong
      # thing to discover after publishing — so the presence of both RIDs is asserted here, before
      # anything is pushed anywhere.
      - name: Assert both launcher RIDs are present
        shell: pwsh
        run: |
          $root = 'src/Shenora.Launcher.Native/artifacts/runtimes'
          foreach ($rid in @('win-x64', 'linux-x64')) {
            $found = Get-ChildItem "$root/$rid/native" -File -ErrorAction SilentlyContinue
            if (-not $found) { throw "launcher binary missing for $rid — the matrix job did not deliver it" }
            Write-Host ("  ok  {0}: {1} ({2:N0} bytes)" -f $rid, $found[0].Name, $found[0].Length)
          }

      - name: Pack
        run: node devtools/dev.mjs pack

      - name: NuGet login (Trusted Publishing / OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Jiarong.Gu

      # A dry run must SAY what it rehearsed, or it is indistinguishable from a run that quietly did
      # nothing — which is the failure mode a rehearsal exists to rule out.
      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          Write-Host "DRY RUN - nothing was published and no git state changed."
          Write-Host "  version that WOULD ship: ${{ steps.version.outputs.version }} (tag ${{ steps.version.outputs.tag }})"
          Write-Host "  release files rewritten in the working tree only: ${{ steps.version.outputs.changed }}"
          Write-Host "  OIDC trusted publishing: the NuGet login step above succeeded, so the policy matches this repo + workflow."
          Write-Host "  packages that would be pushed:"
          Get-ChildItem publish/packages -File | ForEach-Object { Write-Host "    $($_.Name)" }

      # Enumerate and push each package explicitly rather than handing dotnet a wildcard.
      # `dotnet nuget push "publish/packages/*.nupkg"` is the family's command and works in the
      # sibling library — because that one runs on ubuntu-latest, where the SHELL expands the glob
      # before dotnet sees it. This job runs on windows-latest (the net10.0-windows targets need
      # it), pwsh does not expand inside quotes, and dotnet took the pattern literally:
      # "error: File does not exist (publish/packages/*.nupkg)". Copying a command across platforms
      # is where that hid.
      #
      # Enumerating also lets the step FAIL LOUDLY when Pack produced nothing, instead of pushing a
      # wildcard that matches zero files and calling it a success.
      - name: Push to NuGet
        if: ${{ !inputs.dry_run }}
        run: |
          # Match on Extension, not -Filter: -Filter uses the legacy filesystem matcher (8.3 aliases
          # and all), and `.snupkg` sitting beside every `.nupkg` is exactly the kind of near-miss it
          # can surprise you with. dotnet pushes the adjacent .snupkg automatically anyway, so this
          # list must contain ONLY the .nupkg files.
          $packages = Get-ChildItem 'publish/packages' -File | Where-Object { $_.Extension -eq '.nupkg' }
          if (-not $packages) { throw "no .nupkg found in publish/packages - did the Pack step run?" }
          Write-Host "pushing $($packages.Count) package(s)"
          foreach ($package in $packages) {
            Write-Host "  $($package.Name)"
            dotnet nuget push $package.FullName `
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed for $($package.Name)" }
          }

      # Publish the tarball PACK produced — not a rebuild. `npm publish` from the package directory
      # re-runs `prepublishOnly`, which builds a SECOND artifact: the thing whose sha256 the Pack step
      # printed, and which P6.1's consumer test exercises, would then not be the thing that shipped.
      # Publishing the file closes that gap and skips the redundant rebuild.
      #
      # Idempotent, to match `dotnet nuget push --skip-duplicate` above. npm has no such flag and
      # fails hard (E403/EPUBLISHCONFLICT) when the version exists, so without this guard ANY failure
      # after both pushes — a rejected bump commit, a tag push race — leaves every re-run stuck at
      # this step, unable to ever complete the bump or the tag. The two registries cannot be made
      # atomic; what they can be is re-runnable.
      - name: Publish npm (@shenora/react)
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm Trusted Publishing (OIDC) needs a newer npm CLI than Node 22 bundles; harmless
          # when NPM_TOKEN auth is used instead.
          npm install -g npm@latest

          $v = '${{ steps.version.outputs.version }}'
          $tgz = Get-ChildItem 'publish/packages' -Filter 'shenora-react-*.tgz' | Select-Object -First 1
          if (-not $tgz) { throw "no @shenora/react tarball in publish/packages - did Pack run?" }

          # A missing package (the FIRST publish) makes `npm view` exit non-zero; that is "not
          # published", not an error. Only an exact version match means skip.
          $live = npm view "@shenora/react@$v" version 2>$null
          if ($LASTEXITCODE -eq 0 -and $live -eq $v) {
            Write-Host "@shenora/react@$v is already published - skipping (matches --skip-duplicate)"
          } else {
            $global:LASTEXITCODE = 0
            Write-Host "publishing $($tgz.Name)"
            npm publish $tgz.FullName --provenance --access public
            if ($LASTEXITCODE -ne 0) { throw "npm publish failed" }
          }

      - name: Commit version bump
        if: ${{ steps.version.outputs.changed == 'true' && !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Named explicitly so nothing else the job touched — a publish/ artifact, a scratch file —
          # can ride along into a release commit. These five all move in lockstep with a release and
          # are all rewritten by "Determine version" above (VersionPrefix + the CHANGELOG stamp
          # directly; README `## Status`, docs/ARCHITECTURE.md's `## Current state` line and the npm
          # version via `doctor --fix`). Must match the `git status --porcelain` list up there.
          git add src/Directory.Build.props CHANGELOG.md README.md docs/ARCHITECTURE.md src/Shenora.React/package.json
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git push

      - name: Create tag
        if: ${{ inputs.create_tag && !inputs.dry_run }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          if (git tag -l $tag) { Write-Host "tag $tag already exists — leaving it" }
          else {
            git tag -a $tag -m "Shenora ${{ steps.version.outputs.version }}"
            git push origin $tag
          }

      - name: Generate release notes
        id: notes
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          # Previous release tag = the highest tag STRICTLY LESS than the one being cut, compared
          # NUMERICALLY (so 1.10.0 > 1.6.0, which git tag order gets wrong).
          # "Strictly less" rather than "not equal": excluding only the current tag means re-cutting
          # an older version picks a NEWER tag as the baseline, and `git log v1.1.0..HEAD` for a
          # v1.0.0 release yields notes that are empty or describe the wrong direction entirely.
          $curV = [version]($tag.Substring(1))
          $prev = git tag -l 'v*' |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and [version]($_.Substring(1)) -lt $curV } |
            Sort-Object { [version]($_.Substring(1)) } | Select-Object -Last 1
          $range = if ($prev) { "$prev..HEAD" } else { 'HEAD' }
          $subjects = git log $range --pretty=%s --no-merges
          $feat = @(); $fix = @(); $other = @()
          foreach ($s in $subjects) {
            if ($s -match '^chore|^docs|^refactor|^style|^perf|^test|^ci|^build') { continue }
            elseif ($s -match '^feat') { $feat += "- $s" }
            elseif ($s -match '^fix') { $fix += "- $s" }
            else { $other += "- $s" }
          }
          $lines = @()
          if ($feat)  { $lines += '## New features'; $lines += $feat; $lines += '' }
          if ($fix)   { $lines += '## Fixes'; $lines += $fix; $lines += '' }
          if ($other) { $lines += '## Other changes'; $lines += $other; $lines += '' }
          if (-not ($feat -or $fix -or $other)) { $lines += 'See CHANGELOG.md for details.'; $lines += '' }
          $lines += '---'
          $lines += ''
          $lines += 'Install: `dotnet add package Shenora.Windows` (or the leaf package you need — the rest arrive transitively) and `npm i @shenora/react`. Full detail in CHANGELOG.md.'
          Set-Content release-notes.md ($lines -join "`n") -Encoding utf8

      # NOTE (P5.5 H5): this action CREATES tag_name when the tag doesn't exist, so gating only the
      # "Create tag" step above left `create_tag: false` still producing a tag — at the default-branch
      # head, which may not be the published commit. Gate the release step on the same input so
      # "don't tag" actually means it; a no-tag run publishes the packages and skips the GitHub
      # release (nuget.org/npmjs.com are the canonical homes anyway).
      - name: Create GitHub release
        if: ${{ inputs.create_tag && !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Shenora ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          # No attached binaries on purpose — nuget.org/npmjs.com are the canonical homes.
